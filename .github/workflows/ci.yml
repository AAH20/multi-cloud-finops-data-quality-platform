name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: finops-reliability fixtures/billing-good.csv --invoices fixtures/invoices-good.csv --ledger fixtures/ledger-good.csv --as-of 2026-09-08 --output close-report.json
      - run: python -c "import json; assert json.load(open('close-report.json'))['close_ready'] is True"
      - run: python -m compileall -q src

